name: Build and publish Android

on:
  push:
    tags:
      - 'v0.0.1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.jks
          else
            keytool -genkeypair -v \
              -keystore android/app/my-release-key.jks \
              -storepass 123456 \
              -keypass 123456 \
              -alias my-key-alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Mookup, OU=Mobile, O=Team Mookup, L=Paris, ST=Ile-de-France, C=FR"
          fi

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          name: Mookup Messagerie Android v0.0.1
          body: Android APK officielle de Mookup Messagerie.
          files: android/app/build/outputs/apk/release/Mookup-Messagerie.apk
          fail_on_unmatched_files: true
