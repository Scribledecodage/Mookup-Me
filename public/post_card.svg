<svg width="650" height="380" viewBox="0 -30 650 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <clipPath id="beachClip">
      <rect x="20" y="140" width="440" height="100" rx="8"/>
    </clipPath>

    <!-- carte Aaron définie une seule fois, réutilisée deux fois (devant / derrière) -->
    <g id="aaronCardContent">
      <rect x="0" y="0" width="480" height="314" rx="12" fill="#3a3d5c" stroke="#4a4d70" stroke-width="0.5"/>

      <circle cx="44" cy="44" r="22" fill="#bfdbfe"/>
      <circle cx="44" cy="44" r="12" fill="#15803d"/>

      <text x="78" y="40" font-size="15" font-weight="500" fill="#eceeef">Aaron</text>
      <text x="78" y="58" font-size="13" fill="#b0b3ba">@aaron &#183; 2h</text>

      <text x="20" y="94" font-size="15" fill="#eceeef">
        <tspan x="20" dy="0">Petit tour improvisé au bord de l'eau ce week-end. Le genre de</tspan>
        <tspan x="20" dy="22">pause dont on ressort avec la tête vidée.</tspan>
      </text>

      <g clip-path="url(#beachClip)">
        <rect x="20" y="140" width="440" height="100" fill="url(#skyGrad)"/>
        <circle cx="426" cy="158" r="17" fill="#fef3c7"/>
        <path d="M20 218 L86 196 L134 214 L196 182 L240 212 L306 190 L346 214 L460 196 L460 240 L20 240 Z" fill="#fde68a"/>
      </g>
      <rect x="20" y="140" width="440" height="100" rx="8" fill="none" stroke="#5a5d66" stroke-width="0.5"/>

      <line x1="20" y1="264" x2="460" y2="264" stroke="#4a4d70" stroke-width="0.5"/>

      <g transform="translate(20,280)" stroke="#b0b3ba" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" transform="scale(0.75)"/>
      </g>
      <text x="42" y="295" font-size="13" fill="#b0b3ba">12</text>

      <g transform="translate(76,280)" stroke="#b0b3ba" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 1l4 4-4 4 M3 11V9a4 4 0 0 1 4-4h14 M7 23l-4-4 4-4 M21 13v2a4 4 0 0 1-4 4H3" transform="scale(0.75)"/>
      </g>
      <text x="98" y="295" font-size="13" fill="#b0b3ba">4</text>

      <!-- like : état statique par défaut (pas de cadre, cœur gris, 38), plus d'animation -->
      <g transform="translate(132,280)">
        <g stroke="#b0b3ba" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" transform="scale(0.75)"/>
        </g>
        <text x="22" y="15" font-size="13" fill="#b0b3ba">38</text>
      </g>

      <g transform="translate(438,280)" stroke="#787c84" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g transform="scale(0.75)">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <path d="M8.6 13.5l6.8 4"/><path d="M15.4 6.5l-6.8 4"/>
        </g>
      </g>
    </g>
  </defs>

  <!-- Aaron dessinée en premier, donc derrière Léa : décalée en haut à droite pour dépasser
       à moitié (bande du haut + bande de droite visibles, le reste est masqué par Léa) -->
  <g transform="translate(150,-30)">
    <use href="#aaronCardContent"/>
  </g>

  <!-- petite étoile décorative au-dessus du coin haut-gauche de la carte de Léa -->
  <g transform="translate(55,55) scale(0.3)">
    <path fill="#5046e5" d="M80 10
             C86 60 100 74 150 80
             C100 86 86 100 80 150
             C74 100 60 86 10 80
             C60 74 74 60 80 10
             Z"/>
  </g>

  <!-- ===================== CARTE LÉA (au premier plan) ===================== -->
  <g transform="translate(20,110)">
    <rect x="0" y="0" width="480" height="200" rx="12" fill="#3a3d5c" stroke="#4a4d70" stroke-width="0.5"/>

    <circle cx="44" cy="44" r="22" fill="#5046e5"/>
    <rect x="35" y="35" width="18" height="18" rx="5" fill="#ffffff"/>

    <text x="78" y="40" font-size="15" font-weight="500" fill="#eceeef">Léa</text>
    <text x="78" y="58" font-size="13" fill="#b0b3ba">@leamrt &#183; 45min</text>

    <text x="20" y="94" font-size="15" fill="#eceeef">
      <tspan x="20" dy="0">Mon chat a décidé que le clavier était plus confortable que son</tspan>
      <tspan x="20" dy="22">panier. Encore une soirée de travail compromise.</tspan>
    </text>

    <line x1="20" y1="150" x2="460" y2="150" stroke="#4a4d70" stroke-width="0.5"/>

    <g transform="translate(20,166)" stroke="#b0b3ba" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" transform="scale(0.75)"/>
    </g>
    <text x="42" y="181" font-size="13" fill="#b0b3ba">7</text>

    <g transform="translate(76,166)" stroke="#b0b3ba" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 1l4 4-4 4 M3 11V9a4 4 0 0 1 4-4h14 M7 23l-4-4 4-4 M21 13v2a4 4 0 0 1-4 4H3" transform="scale(0.75)"/>
    </g>
    <text x="98" y="181" font-size="13" fill="#b0b3ba">2</text>

    <g transform="translate(132,166)" stroke="#b0b3ba" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" transform="scale(0.75)"/>
    </g>
    <text x="154" y="181" font-size="13" fill="#b0b3ba">21</text>

    <g transform="translate(438,166)" stroke="#787c84" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="scale(0.75)">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <path d="M8.6 13.5l6.8 4"/><path d="M15.4 6.5l-6.8 4"/>
      </g>
    </g>
  </g>

</svg>
