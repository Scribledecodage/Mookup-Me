<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #5046e5; }
      .screen-body { fill: #2b2d42; }
      .screen-frame { fill: #f4f4f6; }
      .stand { fill: #d8d8de; }
      .row { fill: #3a3d5c; }
      .dot { }
      .bar { fill: #4a4d70; }
      .shape { opacity: 0.5; }
    </style>
  </defs>

  <!-- laptop / monitor stand -->
  <rect class="stand" x="430" y="560" width="140" height="14" rx="7" stroke="#000000" stroke-width="2"/>
  <rect class="stand" x="480" y="500" width="40" height="65" stroke="#000000" stroke-width="2"/>

  <!-- book leaning against the left side of the screen, roughly screen-height sized -->
  <g transform="translate(-110.7,192.1) scale(2.72)">
    <g transform="rotate(6 80 140)">
      <rect x="42" y="30" width="6" height="110" rx="2" fill="#a8e6b0" stroke="#000000" stroke-width="2"/>
      <rect x="48" y="30" width="36" height="110" rx="3" fill="#f4f4f6" stroke="#000000" stroke-width="2"/>
      <line x1="53" y1="34" x2="53" y2="136" stroke="#d8d8de" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="58" y1="34" x2="58" y2="136" stroke="#d8d8de" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="63" y1="34" x2="63" y2="136" stroke="#d8d8de" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="68" y1="34" x2="68" y2="136" stroke="#d8d8de" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="73" y1="34" x2="73" y2="136" stroke="#d8d8de" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="78" y1="34" x2="78" y2="136" stroke="#d8d8de" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M42 30 V140 H84 V30" fill="none" stroke="#3ca35f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- screen frame -->
  <rect class="screen-frame" x="150" y="120" width="700" height="440" rx="18" stroke="#000000" stroke-width="2"/>

  <!-- screen inner (dark app bg) -->
  <rect class="screen-body" x="168" y="138" width="664" height="404" rx="10"/>

  <!-- sidebar -->
  <rect x="168" y="138" width="150" height="404" rx="10" fill="#23253a"/>
  <!-- sidebar avatar -->
  <circle cx="205" cy="170" r="16" fill="#8e9bff"/>
  <rect x="230" y="163" width="70" height="8" rx="4" fill="#5a5d80"/>
  <rect x="230" y="176" width="50" height="6" rx="3" fill="#4a4d70"/>
  <!-- sidebar list items -->
  <g fill="#3a3d5c">
    <rect x="180" y="210" width="126" height="26" rx="6"/>
    <rect x="180" y="244" width="126" height="26" rx="6" fill="#4a4d70"/>
    <rect x="180" y="278" width="126" height="26" rx="6"/>
    <rect x="180" y="312" width="126" height="26" rx="6"/>
    <rect x="180" y="346" width="126" height="26" rx="6"/>
  </g>
  <!-- little colored dots like online status -->
  <circle cx="192" cy="223" r="4" fill="#8e9bff"/>
  <circle cx="192" cy="257" r="4" fill="#ff8fa3"/>
  <circle cx="192" cy="291" r="4" fill="#7ee787"/>
  <circle cx="192" cy="325" r="4" fill="#ffd166"/>
  <circle cx="192" cy="359" r="4" fill="#8e9bff"/>

  <!-- main feed column -->
  <!-- thread mini-header: icon + name -->
  <circle cx="346" cy="163" r="10" fill="#8e9bff"/>
  <rect x="362" y="158" width="80" height="10" rx="5" fill="#c9cbe8"/>

  <!-- intro card (same height as a post) -->
  <g>
    <rect x="332" y="182" width="330" height="70" rx="10" fill="#8e9bff"/>
    <circle cx="352" cy="202" r="10" fill="#ffffff"/>
    <rect x="370" y="196" width="70" height="9" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="348" y="220" width="200" height="7" rx="3" fill="#ffffff" opacity="0.75"/>
    <rect x="348" y="232" width="150" height="7" rx="3" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- feed posts -->
  <g>
    <rect x="332" y="260" width="330" height="70" rx="10" fill="#2f3155"/>
    <circle cx="352" cy="280" r="10" fill="#ff8fa3"/>
    <rect x="370" y="274" width="60" height="8" rx="4" fill="#5a5d80"/>
    <rect x="348" y="298" width="290" height="8" rx="4" fill="#4a4d70"/>
    <rect x="348" y="312" width="220" height="8" rx="4" fill="#4a4d70"/>
  </g>

  <g>
    <rect x="332" y="338" width="330" height="70" rx="10" fill="#2f3155"/>
    <circle cx="352" cy="358" r="10" fill="#7ee787"/>
    <rect x="370" y="352" width="60" height="8" rx="4" fill="#5a5d80"/>
    <rect x="348" y="376" width="290" height="8" rx="4" fill="#4a4d70"/>
    <rect x="348" y="390" width="180" height="8" rx="4" fill="#4a4d70"/>
  </g>

  <g>
    <rect x="332" y="416" width="330" height="70" rx="10" fill="#2f3155"/>
    <circle cx="352" cy="436" r="10" fill="#ffd166"/>
    <rect x="370" y="430" width="60" height="8" rx="4" fill="#5a5d80"/>
    <rect x="348" y="454" width="290" height="8" rx="4" fill="#4a4d70"/>
    <rect x="348" y="468" width="240" height="8" rx="4" fill="#4a4d70"/>
  </g>

  <!-- composer bar docked at bottom of feed -->
  <rect x="332" y="504" width="330" height="32" rx="8" fill="#3a3d5c"/>
  <circle cx="352" cy="520" r="7" fill="#8e9bff"/>
  <rect x="368" y="516" width="120" height="8" rx="4" fill="#5a5d80"/>

  <!-- right gallery panel (abstract placeholder blocks only) -->
  <rect x="676" y="150" width="146" height="24" rx="6" fill="#5a5d80"/>
  <g fill="#3a3d5c">
    <rect x="676" y="184" width="68" height="60" rx="8"/>
    <rect x="754" y="184" width="68" height="60" rx="8"/>
    <rect x="676" y="252" width="68" height="60" rx="8"/>
    <rect x="754" y="252" width="68" height="60" rx="8"/>
    <rect x="676" y="320" width="68" height="60" rx="8"/>
    <rect x="754" y="320" width="68" height="60" rx="8"/>
    <rect x="676" y="388" width="68" height="60" rx="8"/>
    <rect x="754" y="388" width="68" height="60" rx="8"/>
  </g>
  <!-- small play triangle icons on some tiles to suggest media -->
  <g fill="#8e9bff">
    <polygon points="700,208 700,224 714,216"/>
    <polygon points="778,344 778,360 792,352"/>
  </g>

</svg>
