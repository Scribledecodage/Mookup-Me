<svg width="375" height="700" viewBox="0 0 375 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #5046e5; }
      .screen-body { fill: #2b2d42; }
      .screen-frame { fill: #f4f4f6; }
    </style>
  </defs>

  <!-- phone frame -->
  <rect class="screen-frame" x="1" y="1" width="373" height="698" rx="34" stroke="#000000" stroke-width="2"/>
  <!-- phone inner (dark app bg) -->
  <rect class="screen-body" x="10" y="10" width="355" height="680" rx="24"/>

  <!-- top status/notch -->
  <rect x="150" y="22" width="75" height="18" rx="9" fill="#1c1e30"/>

  <!-- thread mini-header: icon + name -->
  <circle cx="42" cy="70" r="10" fill="#8e9bff"/>
  <rect x="58" y="65" width="90" height="10" rx="5" fill="#c9cbe8"/>

  <!-- intro card (same height as a post) -->
  <g>
    <rect x="26" y="94" width="323" height="78" rx="12" fill="#8e9bff"/>
    <circle cx="48" cy="116" r="11" fill="#ffffff"/>
    <rect x="68" y="110" width="80" height="10" rx="5" fill="#ffffff" opacity="0.95"/>
    <rect x="42" y="132" width="220" height="8" rx="4" fill="#ffffff" opacity="0.75"/>
    <rect x="42" y="146" width="160" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- feed posts -->
  <g>
    <rect x="26" y="184" width="323" height="78" rx="12" fill="#2f3155"/>
    <circle cx="48" cy="206" r="11" fill="#ff8fa3"/>
    <rect x="68" y="200" width="66" height="9" rx="4" fill="#5a5d80"/>
    <rect x="42" y="222" width="290" height="9" rx="4" fill="#4a4d70"/>
    <rect x="42" y="238" width="230" height="9" rx="4" fill="#4a4d70"/>
  </g>

  <g>
    <rect x="26" y="274" width="323" height="78" rx="12" fill="#2f3155"/>
    <circle cx="48" cy="296" r="11" fill="#7ee787"/>
    <rect x="68" y="290" width="66" height="9" rx="4" fill="#5a5d80"/>
    <rect x="42" y="312" width="290" height="9" rx="4" fill="#4a4d70"/>
    <rect x="42" y="328" width="190" height="9" rx="4" fill="#4a4d70"/>
  </g>

  <g>
    <rect x="26" y="364" width="323" height="78" rx="12" fill="#2f3155"/>
    <circle cx="48" cy="386" r="11" fill="#ffd166"/>
    <rect x="68" y="380" width="66" height="9" rx="4" fill="#5a5d80"/>
    <rect x="42" y="402" width="290" height="9" rx="4" fill="#4a4d70"/>
    <rect x="42" y="418" width="250" height="9" rx="4" fill="#4a4d70"/>
  </g>

  <g>
    <rect x="26" y="454" width="323" height="78" rx="12" fill="#2f3155"/>
    <circle cx="48" cy="476" r="11" fill="#8e9bff"/>
    <rect x="68" y="470" width="66" height="9" rx="4" fill="#5a5d80"/>
    <rect x="42" y="492" width="290" height="9" rx="4" fill="#4a4d70"/>
    <rect x="42" y="508" width="210" height="9" rx="4" fill="#4a4d70"/>
  </g>

  <!-- composer bar docked at bottom of feed -->
  <rect x="26" y="608" width="323" height="42" rx="10" fill="#3a3d5c"/>
  <circle cx="50" cy="629" r="9" fill="#8e9bff"/>
  <rect x="70" y="623" width="150" height="10" rx="5" fill="#5a5d80"/>

</svg>
